[package]
name = "battery-strip"
version = "0.3.0"
edition = "2021"
description = "Thin taskbar strip showing Logitech mouse/headset battery (HID++ 2.0)"
license = "MIT"

[dependencies]
fontdue = "0.9.5"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
]

[profile.release]
opt-level = 3
codegen-units = 1
